name: tortoise_assignment
description: A Flutter marketplace app with product catalog and detail pages
publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ">=3.0.0 <4.0.0"

dependencies:
    flutter:
        sdk: flutter
    flutter_bloc: ^8.1.3
    equatable: ^2.0.5
    carousel_slider: ^5.0.0
    phosphor_flutter: ^2.1.0
    google_fonts: ^6.3.2
    smooth_page_indicator: ^1.2.1
    flutter_svg: ^2.2.1
    inner_shadow_container: ^1.0.4

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^3.0.0

flutter:
    uses-material-design: true

    fonts:
        - family: HafferXH
          fonts:
              - asset: assets/fonts/haffer/HafferXH-TRIAL-Thin.ttf
                weight: 100
              - asset: assets/fonts/haffer/HafferXH-TRIAL-ThinItalic.ttf
                weight: 100
                style: italic
              - asset: assets/fonts/haffer/HafferXH-TRIAL-Light.ttf
                weight: 300
              - asset: assets/fonts/haffer/HafferXH-TRIAL-LightItalic.ttf
                weight: 300
                style: italic
              - asset: assets/fonts/haffer/HafferXH-TRIAL-Regular.ttf
                weight: 400
              - asset: assets/fonts/haffer/HafferXH-TRIAL-RegularItalic.ttf
                weight: 400
                style: italic
              - asset: assets/fonts/haffer/HafferXH-TRIAL-Medium.ttf
                weight: 500
              - asset: assets/fonts/haffer/HafferXH-TRIAL-MediumItalic.ttf
                weight: 500
                style: italic
              - asset: assets/fonts/haffer/HafferXH-TRIAL-SemiBold.ttf
                weight: 600
              - asset: assets/fonts/haffer/HafferXH-TRIAL-SemiBoldItalic.ttf
                weight: 600
                style: italic
              - asset: assets/fonts/haffer/HafferXH-TRIAL-Bold.ttf
                weight: 700
              - asset: assets/fonts/haffer/HafferXH-TRIAL-BoldItalic.ttf
                weight: 700
                style: italic
              - asset: assets/fonts/haffer/HafferXH-TRIAL-Heavy.ttf
                weight: 800
              - asset: assets/fonts/haffer/HafferXH-TRIAL-HeavyItalic.ttf
                weight: 800
                style: italic
              - asset: assets/fonts/haffer/HafferXH-TRIAL-Black.ttf
                weight: 900
              - asset: assets/fonts/haffer/HafferXH-TRIAL-BlackItalic.ttf
                weight: 900
                style: italic

    assets:
        - assets/
        - assets/icons/
        - assets/brands/
        - assets/fonts/
